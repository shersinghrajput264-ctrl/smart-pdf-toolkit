<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart PDF Toolkit</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#151a26;
}

header{
    background:white;
    border-bottom:1px solid #ddd;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
}

.logo{
    font-weight:bold;
    font-size:22px;
}

.hero{
    text-align:center;
    background:white;
    padding:65px 20px 80px;
}

.hero h1{
    font-size:44px;
    margin:0 0 20px;
}

.hero p{
    color:#666;
    font-size:19px;
    line-height:1.5;
}

.ad{
    height:130px;
    max-width:640px;
    margin:35px auto;
    border:1px dashed #bbb;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
}

.container{
    max-width:950px;
    margin:auto;
    padding:0 18px 50px;
}

.card{
    background:white;
    padding:28px;
    border-radius:20px;
    margin:22px 0;
    box-shadow:0 7px 25px rgba(0,0,0,.07);
}

.card h2{
    font-size:30px;
    margin-top:0;
}

.card p{
    color:#666;
    line-height:1.5;
}

.filebox{
    border:2px dashed #ccd3df;
    padding:20px;
    border-radius:12px;
    background:#fafbfe;
    margin:20px 0;
}

input[type="file"]{
    width:100%;
    font-size:16px;
}

input[type="number"],
select{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccd2dc;
    border-radius:10px;
    background:white;
}

input[type="range"]{
    width:100%;
}

label{
    display:block;
    margin:8px 0;
    font-weight:bold;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:15px;
}

button{
    width:100%;
    padding:16px;
    margin-top:18px;
    border:0;
    border-radius:11px;
    background:#3157d5;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#2446b8;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.preview{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
    margin-top:15px;
}

.preview img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:9px;
    border:1px solid #ddd;
}

.status{
    display:none;
    padding:13px;
    margin-top:15px;
    border-radius:9px;
    line-height:1.4;
}

.status.show{
    display:block;
}

.status.error{
    background:#fff0f0;
    color:#a21d1d;
}

.status.success{
    background:#effbf2;
    color:#176b2b;
}

.status.info{
    background:#eef3ff;
    color:#2446b8;
}

.footer{
    text-align:center;
    color:#777;
    padding:30px;
}

@media(max-width:650px){

    .hero{
        padding:50px 18px 65px;
    }

    .hero h1{
        font-size:35px;
    }

    .hero p{
        font-size:17px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .card{
        padding:22px;
    }

    .card h2{
        font-size:27px;
    }

    header{
        padding:16px 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">📄 Smart PDF Toolkit</div>
    <div>Free Tools</div>
</header>

<section class="hero">
    <h1>PDF & Image Tools</h1>
    <p>
        Convert, compress and resize your images easily.
    </p>
</section>

<div class="ad">
    Advertisement
</div>

<main class="container">

<!-- IMAGE TO PDF -->

<section class="card">

    <h2>🖼️ Image → PDF</h2>

    <p>
        Select one or multiple images and combine them into one PDF.
    </p>

    <div class="filebox">
        <input
            id="pdfFiles"
            type="file"
            accept="image/*"
            multiple
        >
    </div>

    <div id="pdfPreview" class="preview"></div>

    <div class="row">

        <div>
            <label for="pageSize">Page Size</label>

            <select id="pageSize">
                <option value="a4">A4</option>
                <option value="fit">Fit Image</option>
            </select>
        </div>

        <div>
            <label for="orientation">Orientation</label>

            <select id="orientation">
                <option value="auto">Auto</option>
                <option value="portrait">
